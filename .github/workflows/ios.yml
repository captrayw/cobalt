name: iOS

# Builds the iPhone app (apps/web/ios) on a Mac runner, opens it in the largest iPhone simulator
# and takes screenshots. Run by hand with "Upload to TestFlight" ticked, it also signs the app
# with Apple's cloud signing and uploads it to App Store Connect. docs/app-store.md has the steps.

on:
  push:
    branches: [main]
    paths: ['apps/web/**', 'packages/**', 'pnpm-lock.yaml', '.github/workflows/ios.yml']
  pull_request:
    paths: ['apps/web/**', 'packages/**', 'pnpm-lock.yaml', '.github/workflows/ios.yml']
  workflow_dispatch:
    inputs:
      testflight:
        description: Upload to TestFlight (needs the four App Store secrets)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT: apps/web/ios/App/App.xcodeproj
  BUNDLE_ID: com.acolorcompany.cobalt

jobs:
  simulator:
    name: Build and open in the iPhone simulator
    runs-on: macos-26
    timeout-minutes: 40
    permissions:
      # Pushes the screenshots and the app's log to the ios-ci branch.
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build the web app and copy it into the iPhone project
        run: pnpm --filter @calm/web ios:build
      - run: xcodebuild -version
      - name: Pick the largest iPhone simulator
        id: sim
        run: |
          udid=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          devices = [d for runtime, ds in json.load(sys.stdin)["devices"].items() if "iOS" in runtime for d in ds]
          for name in ("iPhone 17 Pro Max", "iPhone 16 Pro Max"):
              found = [d for d in devices if d["name"] == name]
              if found:
                  print(found[-1]["udid"])
                  break
          else:
              print(next(d["udid"] for d in devices if d["name"].startswith("iPhone")))
          ')
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices | grep "$udid"
      - name: Build for the simulator
        run: |
          mkdir -p ios-ci
          status=0
          xcodebuild -project "$PROJECT" -scheme App -configuration Debug \
            -destination "id=${{ steps.sim.outputs.udid }}" -derivedDataPath build/sim \
            CODE_SIGNING_ALLOWED=NO build > ios-ci/xcodebuild.log 2>&1 || status=$?
          grep -E "error:|warning: .*App/App/|BUILD (SUCCEEDED|FAILED)" ios-ci/xcodebuild.log | tail -n 80 || true
          exit $status
      - name: Open the app, take screenshots and check its log
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          set -euo pipefail
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          # A freshly booted simulator brings its home screen forward for a while: let it settle.
          sleep 30
          xcrun simctl install "$UDID" build/sim/Build/Products/Debug-iphonesimulator/App.app
          for appearance in light dark; do
            xcrun simctl ui "$UDID" appearance "$appearance"
            # The console PTY prints the app's output line by line, the web app's console included.
            xcrun simctl launch --console-pty --terminate-running-process "$UDID" "$BUNDLE_ID" > "ios-ci/console-$appearance.log" 2>&1 &
            # A simulator's first launch can take half a minute: wait for the web app's ready line.
            waited=0
            until grep -q "iPhone app ready" "ios-ci/console-$appearance.log" || [ "$waited" -ge 120 ]; do
              sleep 1
              waited=$((waited + 1))
            done
            echo "$appearance: ready after about ${waited} s"
            sleep 6
            xcrun simctl io "$UDID" screenshot "ios-ci/feed-$appearance.png"
            sleep 10
            xcrun simctl io "$UDID" screenshot "ios-ci/feed-$appearance-later.png"
            xcrun simctl terminate "$UDID" "$BUNDLE_ID" || true
            wait || true
          done
          cat ios-ci/console-light.log
          # The web app ran in the native shell, its storage opened, and nothing failed or threw.
          grep -q "cobalt: iPhone app ready; storage open" ios-ci/console-light.log
          # The sound starts at launch, without a touch. A runner without audio output may not let it
          # run, so this only reports.
          grep "cobalt: sound at launch" ios-ci/console-*.log || echo "::warning::The log has no sound-at-launch line."
          if grep -E "ERROR|Unable to load|\[error\]" ios-ci/console-*.log; then
            echo "::error::The app logged an error in the simulator (lines above)."
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-simulator
          path: ios-ci
          retention-days: 14
      - name: Publish the screenshots and log to the ios-ci branch
        if: always() && github.event_name == 'push'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd ios-ci
          git init -q -b ios-ci
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "iPhone simulator run ${GITHUB_RUN_NUMBER} for ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ios-ci

  testflight:
    name: Sign and upload to TestFlight
    if: github.event_name == 'workflow_dispatch' && inputs.testflight
    needs: simulator
    runs-on: macos-26
    timeout-minutes: 45
    env:
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - name: Check the App Store secrets
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          missing=0
          for name in TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_PRIVATE_KEY; do
            if [ -z "${!name}" ]; then echo "::error::A secret is missing for $name. docs/app-store.md lists the four secrets."; missing=1; fi
          done
          exit $missing
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build the web app and copy it into the iPhone project
        run: pnpm --filter @calm/web ios:build
      - name: Write the App Store Connect key
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$ASC_PRIVATE_KEY" > "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8"
      # Archived unsigned, then signed on export with Apple's cloud-managed distribution
      # certificate: no certificate or profile is kept here, and no development certificate is
      # created on each run.
      - name: Archive
        run: |
          set -o pipefail
          xcodebuild -project "$PROJECT" -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/cobalt.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            archive | tail -n 60
      - name: Sign and upload to App Store Connect
        run: |
          set -o pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/cobalt.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" | tail -n 80
          echo "::notice::Build $GITHUB_RUN_NUMBER is uploaded. App Store Connect takes a few minutes to process it before it shows in TestFlight."
      - name: Remove the key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
