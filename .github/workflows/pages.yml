name: Deploy to GitHub Pages

# Every push to main publishes the app at the address set in Settings → Pages: its custom domain,
# https://cobalt.acolorcompany.com/, or https://<user>.github.io/<repository>/ without one.
# One-time setup on GitHub: Settings → Pages → Source: GitHub Actions.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time: a newer push waits rather than cancelling one already going out.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # Reads the site's address from the Pages settings, custom domain included.
      - id: pages
        uses: actions/configure-pages@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build for the site's address
        run: pnpm build
        env:
          # '' at the root of a custom domain or a <user>.github.io site; '/<repository>' for a project site.
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
