name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium webkit
        working-directory: apps/web
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Unit, property, color, memory and learning tests
        run: pnpm test
      - name: Audio render tests (Chromium)
        run: pnpm test:audio
      - run: pnpm build
      - name: Feed scenarios, accessibility, offline and performance (Chromium and WebKit)
        run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
